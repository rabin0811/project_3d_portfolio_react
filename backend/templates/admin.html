<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin &mdash; Rabin Humagain Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6C5CE7; --primary-light: #8B7CF7;
      --bg: #0F0A1E; --surface: #1A1230; --surface-hover: #241A3E;
      --text: #E8E0F0; --muted: #8B7F9E; --error: #FF6B6B;
      --success: #00B894; --warning: #FDCB6E;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .admin-header {
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--primary);
    }
    .admin-header a {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .admin-header a:hover { color: var(--text); }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

    /* Login */
    .login-box {
      max-width: 420px; margin: 4rem auto;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 2rem; text-align: center;
    }
    .login-box h2 { font-size: 1.3rem; margin-bottom: 0.5rem; font-weight: 600; }
    .login-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .login-box input {
      width: 100%; padding: 0.7rem 1rem;
      background: var(--bg); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem; margin-bottom: 1rem;
    }
    .login-box input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,92,231,0.2);
    }
    .login-box .login-error { color: var(--error); font-size: 0.85rem; margin-top: 0.5rem; display: none; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1.5rem; border-radius: 9999px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; border: none; transition: all 200ms ease;
    }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-light); transform: translateY(-1px); }
    .btn--ghost {
      background: transparent; border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
    }
    .btn--ghost:hover { border-color: var(--primary); color: var(--text); }
    .btn--sm { padding: 0.4rem 1rem; font-size: 0.78rem; }

    /* Messages */
    .admin-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .admin-toolbar .count { font-size: 0.85rem; color: var(--muted); }
    .admin-toolbar .count strong { color: var(--text); }

    .msg-table { width: 100%; border-collapse: collapse; }
    .msg-table th {
      text-align: left; padding: 0.75rem 1rem;
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.06);
      font-family: 'JetBrains Mono', monospace;
    }
    .msg-table td {
      padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.9rem; vertical-align: top;
    }
    .msg-table tr:hover td { background: rgba(255,255,255,0.02); }
    .msg-table .msg-date { font-size: 0.78rem; color: var(--muted); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
    .msg-table .msg-name { font-weight: 600; }
    .msg-table .msg-email { font-size: 0.82rem; color: var(--muted); }
    .msg-table .msg-text { max-width: 340px; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; line-height: 1.5; }
    .msg-table .msg-id { font-size: 0.75rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
    .empty-state p { font-size: 0.95rem; }
    .loading-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }

    .toast {
      position: fixed; top: 1rem; right: 1rem;
      padding: 0.75rem 1.25rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 500;
      transform: translateY(-120%); transition: transform 300ms ease;
      z-index: 100;
    }
    .toast--show { transform: translateY(0); }
    .toast--error { background: rgba(255,107,107,0.15); color: var(--error); border: 1px solid rgba(255,107,107,0.3); }
    .toast--success { background: rgba(0,184,148,0.15); color: var(--success); border: 1px solid rgba(0,184,148,0.3); }

    @media (max-width: 700px) {
      .container { padding: 1rem; }
      .msg-table th:nth-child(1), .msg-table td:nth-child(1) { display: none; }
      .msg-table th:nth-child(4), .msg-table td:nth-child(4) { display: none; }
      .msg-table .msg-text { max-width: 200px; }
    }
    @media (max-width: 500px) {
      .admin-header { padding: 0.75rem 1rem; flex-direction: column; gap: 0.5rem; text-align: center; }
      .login-box { margin: 2rem 1rem; }
      .admin-toolbar { flex-direction: column; align-items: stretch; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>Admin Panel</h1>
    <a href="http://localhost:5500">&larr; Back to Portfolio</a>
  </header>

  <div class="container" id="app">
    <div class="login-box" id="login-view">
      <h2>Authenticate</h2>
      <p>Enter your admin token to view contact submissions.</p>
      <input type="password" id="token-input" placeholder="Bearer token" autocomplete="off" />
      <button class="btn btn--primary" id="login-btn">Unlock</button>
      <div class="login-error" id="login-error">Invalid token. Please try again.</div>
    </div>

    <div id="messages-view" style="display:none">
      <div class="admin-toolbar">
        <span class="count">Total messages: <strong id="msg-count">0</strong></span>
        <div>
          <button class="btn btn--ghost btn--sm" id="refresh-btn">Refresh</button>
          <button class="btn btn--ghost btn--sm" id="logout-btn">Lock</button>
        </div>
      </div>
      <div id="loading-state" class="loading-state">Loading messages...</div>
      <div id="empty-state" class="empty-state" style="display:none"><p>No messages yet.</p></div>
      <table class="msg-table" id="msg-table" style="display:none">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Message</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="msg-body"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const TOKEN_KEY = 'admin_token';
    const API = '/api/admin/messages';

    const loginView = document.getElementById('login-view');
    const messagesView = document.getElementById('messages-view');
    const tokenInput = document.getElementById('token-input');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const msgCount = document.getElementById('msg-count');
    const msgBody = document.getElementById('msg-body');
    const msgTable = document.getElementById('msg-table');
    const loadingState = document.getElementById('loading-state');
    const emptyState = document.getElementById('empty-state');
    const refreshBtn = document.getElementById('refresh-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const toast = document.getElementById('toast');

    let currentToken = '';

    function showToast(msg, type) {
      toast.textContent = msg;
      toast.className = 'toast toast--' + type + ' toast--show';
      setTimeout(() => { toast.classList.remove('toast--show'); }, 3000);
    }

    function showLogin() {
      loginView.style.display = '';
      messagesView.style.display = 'none';
      tokenInput.value = '';
      loginError.style.display = 'none';
      currentToken = '';
    }

    function showMessages() {
      loginView.style.display = 'none';
      messagesView.style.display = '';
    }

    async function fetchMessages(token) {
      loadingState.style.display = '';
      msgTable.style.display = 'none';
      emptyState.style.display = 'none';

      try {
        const res = await fetch(API, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          showLogin();
          return;
        }
        if (!res.ok) {
          showToast('Failed to load messages', 'error');
          return;
        }
        const data = await res.json();
        renderMessages(data);
      } catch (e) {
        showToast('Network error: ' + e.message, 'error');
      } finally {
        loadingState.style.display = 'none';
      }
    }

    function renderMessages(msgs) {
      if (!msgs || msgs.length === 0) {
        emptyState.style.display = '';
        msgTable.style.display = 'none';
        msgCount.textContent = '0';
        return;
      }
      emptyState.style.display = 'none';
      msgTable.style.display = '';
      msgCount.textContent = msgs.length;

      msgBody.innerHTML = msgs.map(m => {
        const date = new Date(m.created_at);
        const dateStr = date.toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        return '<tr>' +
          '<td><span class="msg-id">#' + m.id + '</span></td>' +
          '<td><div class="msg-name">' + esc(m.name) + '</div><div class="msg-email">' + esc(m.email) + '</div></td>' +
          '<td><div class="msg-text">' + esc(m.message) + '</div></td>' +
          '<td><span class="msg-date">' + dateStr + '</span></td>' +
          '</tr>';
      }).join('');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function tryLogin(token) {
      fetchMessages(token);
      currentToken = token;
      showMessages();
    }

    loginBtn.addEventListener('click', () => {
      const token = tokenInput.value.trim();
      if (!token) { loginError.textContent = 'Please enter a token.'; loginError.style.display = ''; return; }
      loginError.style.display = 'none';
      localStorage.setItem(TOKEN_KEY, token);
      tryLogin(token);
    });

    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    refreshBtn.addEventListener('click', () => fetchMessages(currentToken));
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
    });

    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) {
      tryLogin(saved);
    }
  </script>
</body>
</html>
